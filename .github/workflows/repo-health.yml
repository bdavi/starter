name: Repo health

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    permissions:
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml

  health-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # Installed here (rather than as separate dedicated steps after the
      # script) so the script's own Gitleaks/Semgrep/Bearer sections find
      # real binaries and produce real output instead of "not installed —
      # skipped" — the same commands the script runs locally, run once, not
      # duplicated across a script section and a redundant Action step.
      - name: Install security scanning CLIs (gitleaks, semgrep, bearer)
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          gitleaks_url=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux_x64.tar.gz$")) | .browser_download_url')
          curl -sSL "$gitleaks_url" | tar -xz -C "$HOME/.local/bin" gitleaks

          pipx install semgrep

          curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"

      - name: Repo health script (Knip, pnpm audit, osv-scanner, Gitleaks, Semgrep, Bearer, full E2E suite)
        run: pnpm run health
