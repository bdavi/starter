name: Repo health

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    permissions:
      contents: read
      security-events: write
    # NOTE: google/osv-scanner-action publishes no moving "v2" alias tag —
    # only exact patch tags (v2.3.8, ...). The plain `@v2` this used to say
    # doesn't resolve to anything on GitHub's side; caught while SHA-pinning.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml

  health-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # Installed here (rather than as separate dedicated steps after the
      # script) so the script's own Gitleaks/Semgrep/Bearer sections find
      # real binaries and produce real output instead of "not installed —
      # skipped" — the same commands the script runs locally, run once, not
      # duplicated across a script section and a redundant Action step.
      - name: Install security scanning CLIs (gitleaks, semgrep, bearer)
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          gitleaks_url=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux_x64.tar.gz$")) | .browser_download_url')
          curl -sSL "$gitleaks_url" | tar -xz -C "$HOME/.local/bin" gitleaks

          pipx install semgrep

          curl -sfL https://raw.githubusercontent.com/Bearer/bearer/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"

      - name: Repo health script (Knip, pnpm audit, osv-scanner, Gitleaks, Semgrep, Bearer, full E2E suite)
        run: pnpm run health
