name: Repo health

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    permissions:
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml

  health-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Repo health script (Knip, pnpm audit, full E2E suite, ...)
        run: pnpm run health

      - name: Gitleaks (full history scan)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (fuller ruleset sweep)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan --config p/javascript --config p/typescript --config p/owasp-top-ten --config p/security-audit

      - name: Bearer (fuller sweep)
        continue-on-error: true
        uses: bearer/bearer-action@v2
