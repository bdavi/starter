name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Dependency version consistency (Syncpack)
        # ADR-00004: cross-package version drift (e.g. two packages on
        # different zod versions) risks duplicate runtime instances of
        # singleton libraries and structural type incompatibilities.
        # Deterministic, no false-positive judgment call — blocking.
        run: pnpm run deps:check

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm nx affected -t lint

      - name: Typecheck
        run: pnpm nx affected -t typecheck

      - name: Test
        run: pnpm nx affected -t test

      - name: Build
        # apps/web imports @starter/auth/server (e.g. the dashboard route),
        # which constructs its `db`/`auth` singletons at module scope —
        # `next build`'s page-data-collection step imports every route
        # module to inspect its exports, regardless of whether that route
        # ends up static or dynamic, so this runs even though nothing here
        # ever executes a real query. These are placeholders, not secrets:
        # drizzle-orm/node-postgres and better-auth both only need the
        # values to construct (they don't connect at construction time),
        # the same fact packages/db's and packages/auth's own unit tests
        # already rely on (see client.spec.ts/server.spec.ts) — just needed
        # here too since this is a real `next build`, not Jest.
        run: pnpm nx affected -t build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          BETTER_AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BETTER_AUTH_URL: http://localhost:3000

      - name: Install Playwright browsers (chromium only — critical path is fast by design)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (critical path)
        # ADR-00007: a small, always-run, blocking suite — not the full one.
        # Tag anything that must never break with @critical; everything else
        # only runs in the full on-demand suite (see repo-health.yml).
        run: pnpm nx e2e web-e2e -- --grep @critical --project=chromium

      - name: Secrets scan (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-warn:
    # Separate job: findings here are warnings only (ADR-00009) — never
    # blocks the merge, unlike the `main` job above.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan --config p/javascript --config p/typescript --config p/owasp-top-ten --error

      - name: Bearer
        continue-on-error: true
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2

  zizmor:
    # Verifies the workflow files themselves (ADR-00010) — chiefly that every
    # action ref stays SHA-pinned rather than drifting back to a mutable tag.
    # Blocking, not warn-only: unlike Semgrep/Bearer's app-code findings,
    # there's no ambiguity or false-positive judgment call here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false
