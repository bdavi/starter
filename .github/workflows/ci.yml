name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm nx affected -t lint

      - name: Typecheck
        run: pnpm nx affected -t typecheck

      - name: Test
        run: pnpm nx affected -t test

      - name: Build
        run: pnpm nx affected -t build

      - name: Install Playwright browsers (chromium only — critical path is fast by design)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (critical path)
        # ADR-00007: a small, always-run, blocking suite — not the full one.
        # Tag anything that must never break with @critical; everything else
        # only runs in the full on-demand suite (see repo-health.yml).
        run: pnpm nx e2e web-e2e -- --grep @critical --project=chromium

      - name: Secrets scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-warn:
    # Separate job: findings here are warnings only (ADR-00009) — never
    # blocks the merge, unlike the `main` job above.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Semgrep
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan --config p/javascript --config p/typescript --config p/owasp-top-ten --error

      - name: Bearer
        continue-on-error: true
        uses: bearer/bearer-action@v2
