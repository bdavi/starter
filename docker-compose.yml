services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+'s official image expects a single mount at
      # /var/lib/postgresql (not .../data) — it stores data in a
      # version-specific subdirectory now, for pg_ctlcluster compatibility.
      # See https://github.com/docker-library/postgres/pull/1259.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
